[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-endgame-study-cli"
version = "1.0.0"
description = "Python CLI to study chess endgames from FEN positions, track progress in local JSON, and quiz recall."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Asdale Dynamics, LLC" }]
license = { text = "MIT" }
keywords = ["chess", "endgame", "fen", "cli", "quiz", "study"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Environment :: Console",
    "Topic :: Games/Entertainment :: Board Games",
]

[project.scripts]
chess-endgame-study = "chess_endgame_study.cli:main"

[tool.setuptools]
packages = ["chess_endgame_study", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
